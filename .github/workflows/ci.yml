name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependant
      run: |
        sudo apt update
        sudo apt install -y flex bison gcc g++ gcc-arm-linux-gnueabihf qemu-user qemu-user-static

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: cmake --build ${{github.workspace}}/build --target test

    - name: Test Performance
      working-directory: ${{github.workspace}}/build
      run: cmake --build ${{github.workspace}}/build --target test_performance

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install WinFlexBison
      shell: bash
      run: ./tools/get-winflexbison.sh

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: build
      run: cmake --build . --target test

    - name: Test Performance
      working-directory: build
      run: cmake --build . --target test_performance
